# Cabeçalhos de segurança — incluído no bloco server e em cada location do nginx.conf.
# (add_header não é herdado quando o location define os seus próprios; por isso o include.)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP sem 'unsafe-inline': fontes, CSS e JS são servidos do próprio domínio.
# O JSON-LD (type=application/ld+json) não é executado e não é afetado pela CSP.
# Ao ativar GTM/GA4, acrescente https://www.googletagmanager.com em script-src e connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
