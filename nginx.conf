server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Páginas HTML: URL limpa (/privacidade -> privacidade.html), sem cache longo.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Assets versionados por query string (?v=) no HTML: cache longo é seguro.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }
}
