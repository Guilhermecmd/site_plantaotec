version: "3.7"

services:
  site:
    image: plantaotec-site:latest
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.site.rule=Host(`plantaotec.com.br`) || Host(`www.plantaotec.com.br`)
        - traefik.http.routers.site.entrypoints=websecure
        - traefik.http.routers.site.tls.certresolver=letsencryptresolver
        - traefik.http.services.site.loadbalancer.server.port=80
        - traefik.http.routers.site.middlewares=site-https,site-www
        - traefik.http.middlewares.site-https.headers.sslproxyheaders.X-Forwarded-Proto=https
        # 301 apex -> www (host canônico do canonical/sitemap/JSON-LD). DNS do www
        # confirmado em 2026-09-06 apontando para este servidor.
        - traefik.http.middlewares.site-www.redirectregex.regex=^https?://plantaotec\.com\.br/(.*)
        - traefik.http.middlewares.site-www.redirectregex.replacement=https://www.plantaotec.com.br/$${1}
        - traefik.http.middlewares.site-www.redirectregex.permanent=true

networks:
  network_public:
    external: true
